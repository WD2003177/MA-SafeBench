scenario_type_dir: 'safebench/scenario/config/scenario_type'
scenario_type: 'ma_cut_in.json'
scenario_category: 'planning'
policy_type: 'ma'
ma_template: 'cut_in'

route_dir: 'safebench/scenario/scenario_data/route'
scenario_id: 3
route_id: 11

ego_action_dim: 2
ego_state_dim: 4
ego_action_limit: 1.0

model_path: ''
standard_action: false
buffer_capacity: 100
eval_in_train_freq: 10
save_freq: 10
train_episode: 100

seed: 0
ma_seed: 0
initializer_seed: 0
use_llm: true
ma_llm_model: null
ma_llm_base_url: null
ma_llm_timeout_s: 10
ma_llm_temperature: 0.0
ma_llm_max_retries: 1
ma_llm_multi_agent: true
ma_use_message_pool: true
ma_llm_role_max_tokens: 220
ma_llm_critic_max_tokens: 320
ma_llm_selector_max_tokens: 550
ma_llm_single_max_tokens: 550
ma_llm_message_pool_entries: 12
fallback_policy: 'rule'
ma_fallback_on_llm_error: true
ma_decision_interval_s: 0.5
ma_trace_enabled: true
ma_record_step_metrics: true
ma_force_dummy_action: false
ma_bootstrap_prestage_enabled: true
ma_bootstrap_recover_enabled: true
ma_repair_observe_to_prestage: true
ma_initial_attack_bootstrap_enabled: true
ma_initial_attack_bootstrap_apply_control_immediately: true
ma_initial_attack_bootstrap_striker_tactic: 'slot_sync'
ma_repair_initial_observe_to_contract: true
ma_hold_active_contract_without_llm: true
ma_hard_brake_decel_mps2: -3.0
ma_near_miss_ttc_s: 1.5
ma_near_miss_distance_m: 3.0
ma_cutin_success_gap_m: 12.0
ma_command_transition_warmup_frames: 3

planner:
  controller_dt: 0.1
  pid_lateral_kp: 1.2
  pid_lateral_ki: 0.02
  pid_lateral_kd: 0.08
  pid_longitudinal_kp: 0.5
  pid_longitudinal_ki: 0.02
  pid_longitudinal_kd: 0.0
  pid_max_throttle: 0.55
  pid_max_brake: 0.2
  pid_max_steering: 0.5
  control_trace_enabled: true
  control_trace_interval_s: 0.5
  actuation_velocity_assist_enabled: true
  actuation_velocity_assist_debug_allow_set_target_velocity: false
  actuation_velocity_assist_max_accel_mps2: 4.0
  actuation_velocity_assist_max_jerk_mps3: 8.0
  actuation_velocity_assist_shield_max_jerk_mps3: 8.0
  actuation_velocity_assist_max_speed_mps: 12.0
  actuation_velocity_assist_min_error_mps: 0.4
  actuation_velocity_assist_stall_recovery_enabled: true
  actuation_velocity_assist_stall_recovery_allow_set_target_velocity: true
  actuation_velocity_assist_stall_recovery_max_accel_mps2: 2.0
  actuation_velocity_assist_stall_recovery_max_jerk_mps3: 4.0
  actuation_velocity_assist_stall_recovery_release_speed_mps: 3.0
  actuation_velocity_assist_stall_recovery_max_target_lead_mps: 3.0
  actuation_velocity_assist_stall_speed_mps: 2.0
  actuation_velocity_assist_stall_target_min_mps: 4.0
  actuation_velocity_assist_stall_recovery_min_speed_mps: 0.0
  actuation_velocity_assist_stall_front_gap_m: 8.0
  force_forward_gear_control: true
  realism_abort_grace_s: 2.5
  compress_realism_abort_grace_s: 4.0
  strike_commit_grace_s: 1.0
  committed_danger_grace_s: 1.2
  committed_danger_min_elapsed_ratio: 0.45
  realism_abort_consecutive_steps: 6
  plan_reuse_min_remaining_s: 0.8
  plan_reuse_same_tactic: true
  planner_failure_recover_streak: 3
  bootstrap_launch_duration_s: 2.0
  bootstrap_launch_min_speed_error_mps: 1.0
  bootstrap_launch_min_throttle: 0.22
  shield_plan_start_grace_s: 1.0
  shield_bootstrap_mode: monitor
  shield_compress_mode: soft
  shield_default_mode: soft
  lookahead_distance_m: 6.0
  waypoint_spacing_m: 1.5
  max_plan_horizon_s: 6.0
  min_plan_horizon_s: 2.0
  lane_center_offset_m: 0.0
  spline_smoothing: true
  min_runtime_lane_change_s: 2.2
  max_runtime_lane_change_s: 6.5
  max_attack_speed_mps: 12.0
  merge_route_scan_distance_m: 60.0

  prestage:
    duration_s: 6.0
    min_speed_mps: 6.8
    striker_min_speed_mps: 7.0
    striker_far_min_speed_mps: 5.5
    striker_far_yield_margin_mps: 0.4
    blocker_min_speed_mps: 6.8
    max_speed_mps: 10.5

  trajectory:
    planning_time_budget_ms: 420
    attack_candidate_budget_ms: 340
    fallback_budget_ms: 60
    max_candidate_count: 12
    max_candidate_count_hard: 16
    max_nearby_vehicle_count: 8
    reference_spacing_m: 0.5
    reference_waypoint_step_m: 1.0
    reference_backtrack_m: 20.0
    reference_horizon_m: 100.0
    reference_cache_entries: 32
    dynamics_dt_s: 0.1
    collision_dt_s: 0.04
    collision_broad_phase_margin_m: 3.0
    planning_limit_ratio: 1.0
    wheelbase_m: 2.7
    max_front_wheel_angle_deg: 35.0
    max_front_wheel_angle_rate_degps: 180.0
    max_lateral_jerk_mps3: 8.0
    max_abs_curvature_rate_s: 0.18
    max_abs_curvature_rate_t: 1.2
    same_tactic_prefix_s: 0.35
    tactic_switch_prefix_s: 0.15
    max_prefix_tracking_error_m: 1.5
    max_prefix_heading_error_deg: 15.0
    fallback_horizon_s: 2.5
    fallback_max_accel_mps2: 2.0
    emergency_horizon_s: 3.0
    emergency_max_decel_mps2: 8.0
    emergency_validation_reserve_ms: 8
    max_normalized_steer_command: 1.0
    steering_feedforward_gain: 1.0
    heading_error_gain: 0.8
    cross_track_gain: 0.35
    cross_track_softening_mps: 2.0
    accel_feedforward_gain: 0.08
    max_steer_rate_per_s: 1.0
    max_throttle_rate_per_s: 1.0
    max_brake_rate_per_s: 1.5
    min_time_lookahead_s: 0.2
    max_time_lookahead_s: 0.7
    time_lookahead_speed_gain: 0.04
    shield:
      plan_start_grace_s: 1.0
      filter_alpha: 0.35
      soft_limit_ratio: 0.85
      exit_limit_ratio: 0.72
      soft_limit_frames: 3
      replan_cooldown_s: 0.4
      steer_scale: 0.8
      throttle_scale: 0.7
      front_brake_max_brake: 0.2
      collision_gap_m: 3.0

  contract:
    duration_s: 8.0
    duration_bounds_s: [6.0, 12.0]

  soft_hints:
    default_gap_band: normal
    default_merge_timing: normal
    gap_band_targets_m:
      tight: 5.5
      normal: 8.0
      loose: 12.0

  initializer:
    scenario_variant: 'v2_side_escape_block_plus_opposite_cutin'
    require_three_lane: true
    require_front_blocker_for_slot: false
    cutin_side: 'right'
    block_escape_side: 'left'
    anchor_source: ego
    randomize_spawn_offsets: true
    spawn_offset_sample_count: 16
    normal_speed_mps: 8.0
    initial_speed_mps: 4.0
    striker_initial_speed_mps: 8.8
    blocker_initial_speed_mps: 8.2
    # CARLA reset advances 9 world ticks before policy control; keep the spawn formation during that warm-up.
    warmup_spawn_speed_mps: 6.0
    striker_initial_speed_delta_mps: [0.5, 1.2]
    blocker_initial_speed_delta_mps: [-0.2, 0.4]
    prefer_ego_relative_initial_speed: true
    min_relative_initial_speed_mps: 2.5
    striker_min_initial_speed_mps: 2.5
    blocker_min_initial_speed_mps: 2.5
    avoid_junction: true
    min_junction_distance_m: 30.0
    junction_scan_distance_m: 80.0
    junction_scan_step_m: 2.0
    min_route_remaining_m: 60.0
    min_spawn_separation_m: 4.0
    max_lane_heading_diff_deg: 30.0
    side_candidates: ['right']
    anchor_distances_m: [0, 5, 10, 15]
    # v2 offsets below are final longitudinal positions relative to ego; initializer subtracts anchor_distance_m before spawning.
    rolling_prestage_enabled: true
    striker_prestage_range_m: [16.0, 28.0]
    blocker_prestage_range_m: [6.0, 14.0]
    striker_prestage_offsets_m: [18, 22, 26]
    blocker_prestage_offsets_m: [6, 10, 14]
    striker_lead_range_m: [8.0, 9.0]
    blocker_side_offset_range_m: [-1.0, 3.0]
    striker_lead_offsets_m: [8, 9]
    blocker_side_offsets_m: [-1, 0, 2, 3]
    striker_prepare_window_m: [8.0, 18.0]
    min_ego_front_clearance_m: 22.0
    min_initial_blocker_clearance_m: 5.0
    actor_models:
      attacker_1: 'vehicle.audi.tt'
      blocker_1: 'vehicle.nissan.patrol'

  cut_in_and_brake:
    target_gap_m: 6.0
    target_gap_bounds_m: [4.0, 15.0]
    lane_change_duration_s: 2.5
    lane_change_duration_bounds_s: [1.8, 5.0]
    merge_s_offset_m: 12.0
    merge_s_offset_bounds_m: [8.0, 25.0]
    target_speed_mps: 9.0
    brake_decel_mps2: -4.0
    brake_decel_bounds_mps2: [-6.0, -1.0]
    brake_start_delay_s: 0.3
    hold_after_merge_s: 0.5
    post_brake_duration_s: 1.0

  gain_lead:
    duration_s: 4.0
    speed_ramp_s: 2.5
    speed_delta_mps: 2.5
    min_speed_mps: 8.0
    max_speed_mps: 11.0

  slot_sync:
    duration_s: 4.0
    speed_ramp_s: 2.5
    min_speed_mps: 5.0
    max_speed_mps: 10.5
    compress_min_speed_mps: 5.0
    compress_follow_ego_min_margin_mps: 1.2

  cut_in:
    allow_aggressive_rate_limited_plan: true
    target_gap_m: 7.0
    target_gap_bounds_m: [6.0, 9.0]
    slot_gap_bounds_m: [6.0, 9.0]
    desired_slot_gap_m: 7.0
    start_gap_bounds_m: [6.0, 34.0]
    predicted_slot_gap_bounds_m: [6.0, 9.0]
    predicted_slot_tolerance_m: 2.0
    min_blocker_clearance_m: 5.0
    lead_in_time_s: 0.6
    lead_in_distance_m: 4.5
    lane_change_safety_factor: 1.4
    lookahead_distance_m: 3.5
    max_steer: 0.28
    committed_timeout_s: 7.0
    lane_change_duration_s: 2.8
    lane_change_duration_bounds_s: [2.8, 6.5]
    merge_s_offset_m: 10.0
    merge_s_offset_bounds_m: [8.0, 25.0]
    target_speed_mps: 9.0
    candidate_terminal_speed_offsets_mps: [-1.5, -1.0, -0.5, 0.0, 0.5]
    committed_min_speed_mps: 5.5
    launch_min_speed_mps: 5.0
    hold_active_plan_during_committed: true
    committed_plan_lock_s: 6.5
    suppress_dynamics_only_shield_replan: true
    min_route_remaining_m: 20.0
    max_lane_change_duration_s: 6.5
    brake_start_delay_s: 0.0
    hold_after_merge_s: 0.5
    post_brake_duration_s: 0.0

  front_brake:
    min_gap_m: 4.0
    max_gap_m: 15.0
    max_negative_relative_speed_mps: 3.0
    max_ttc_s: 6.0
    max_heading_error_deg: 20.0
    brake_decel_mps2: -3.5
    brake_decel_bounds_mps2: [-5.0, -1.0]
    brake_duration_s: 1.0
    brake_duration_bounds_s: [0.5, 2.0]
    min_speed_mps: 2.0

  block_ego_lane:
    target_gap_m: 15.0
    target_gap_bounds_m: [10.0, 30.0]
    speed_delta_mps: -1.0
    min_speed_mps: 3.0
    max_decel_mps2: -2.5
    hold_duration_s: 8.0

  seal_escape:
    target_gap_m: 16.0
    target_gap_bounds_m: [10.0, 20.0]
    compress_gap_bounds_m: [14.0, 22.0]
    strike_gap_bounds_m: [10.0, 14.0]
    escape_target_gap_m: 2.5
    escape_gap_bounds_m: [-4.0, 6.0]
    front_window_min_m: 8.0
    front_window_max_m: 24.0
    speed_delta_mps: 0.0
    speed_ramp_s: 2.5
    min_speed_mps: 6.0
    escape_min_speed_mps: 5.5
    escape_compress_min_speed_mps: 5.5
    escape_reacquire_margin_m: 6.0
    escape_apply_min_speed_above_ego_mps: 3.0
    escape_follow_ego_min_margin_mps: 1.0
    max_speed_mps: 10.5
    max_decel_mps2: -2.0
    hold_duration_s: 8.0

  recover:
    normal_speed_mps: 8.0
    duration_s: 5.0
    max_recover_accel_mps2: 0.8
    max_decel_mps2: -2.0
    front_gap_slowdown_m: 10.0
    min_front_gap_m: 5.0

  constraints:
    max_abs_longitudinal_accel_mps2: 6.0
    max_abs_jerk_mps3: 8.0
    max_lateral_accel_mps2: 3.5
    max_heading_error_deg: 45.0
